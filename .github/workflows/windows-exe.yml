name: Windows EXE

# Her main gönderiminde: testler, EXE derleme (build_exe.bat), EXE'nin kendi
# self-test'i ve LMS teslim paketi. Paket "Pacman-teslim" adıyla indirilebilir.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testler
        run: python -m unittest discover -s tests

      - name: EXE derleme
        shell: cmd
        run: build_exe.bat

      - name: EXE self-test
        shell: cmd
        run: |
          start /wait "" dist\Pacman.exe --self-test --report self_test_report.txt
          set CODE=%ERRORLEVEL%
          type self_test_report.txt
          exit /b %CODE%

      - name: Teslim paketi
        run: python tools/make_submission.py dist/Pacman.exe Pacman.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Pacman-teslim
          path: |
            Pacman.zip
            self_test_report.txt
