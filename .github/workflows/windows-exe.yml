name: Windows EXE

# Her main gönderiminde: testler, EXE derleme (build_exe.bat), EXE'nin kendi
# self-test'i ve LMS teslim paketi. Paket "Pacman-teslim" adıyla indirilebilir.
# "v" ile başlayan bir sürüm etiketi gönderilince paket ayrıca o sürümün
# GitHub Release sayfasına eklenir.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write      # yalnızca sürüm etiketinde Release oluşturmak için

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testler
        run: python -m unittest discover -s tests

      - name: EXE derleme
        shell: cmd
        run: build_exe.bat

      - name: EXE self-test
        shell: cmd
        run: |
          start /wait "" dist\Pacman.exe --self-test --report self_test_report.txt
          set CODE=%ERRORLEVEL%
          type self_test_report.txt
          exit /b %CODE%

      - name: Teslim paketi
        run: python tools/make_submission.py dist/Pacman.exe Pacman.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Pacman-teslim
          path: |
            Pacman.zip
            self_test_report.txt

      - name: Sürüm sayfası
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # Sürüm sayfası zaten varsa (ör. web arayüzünden oluşturulduysa) zip ona yüklenir.
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create "${{ github.ref_name }}" --title "Pacman ${{ github.ref_name }}" --notes "LMS teslim paketi: README.txt, Pacman.exe ve Kaynak Kodlar. EXE bu sürümün kaynak kodundan GitHub Actions'ta Windows'ta derlendi ve self-test'ten geçti." }
          gh release upload "${{ github.ref_name }}" Pacman.zip --clobber
